# Builds and tests the whole .NET solution.
#
# The build plan sketched separate ci-api.yml and ci-judge.yml. They are one workflow
# here because they are one solution: splitting them would mean restoring and building
# the same shared projects twice per push to prove the same thing.
name: CI (.NET)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/judge/**'
      - '*.props'
      - 'global.json'
      - 'CodeJudge.slnx'
      - '.github/workflows/ci-dotnet.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/judge/**'
      - '*.props'
      - 'global.json'
      - 'CodeJudge.slnx'
      - '.github/workflows/ci-dotnet.yml'

jobs:
  build-and-test:
    # ubuntu-latest ships a Docker daemon, which the integration tests need for
    # Testcontainers. The judge's own tests need only a .NET runtime.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CodeJudge.slnx

      - name: Build
        run: dotnet build CodeJudge.slnx --configuration Release --no-restore

      # MTP flags, not VSTest ones. --collect and --logger are silently ignored here:
      # xUnit v3 hosts Microsoft.Testing.Platform, opted into via global.json.
      - name: Test
        run: dotnet test --solution CodeJudge.slnx --configuration Release --no-build --coverage --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          # TRX and coverage land in a TestResults folder at the repository root, not
          # beside each project, so both shapes are listed.
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

  docker:
    name: Build images
    runs-on: ubuntu-latest

    # The judge smoke test below seeds a database and then judges against it. A real
    # Postgres is the point: an in-memory substitute would pass happily while the
    # published image is broken, which is the entire class of bug this job exists for.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codejudge
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: codejudge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codejudge -d codejudge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CODEJUDGE_CONNECTION: Host=localhost;Port=5432;Database=codejudge;Username=codejudge;Password=localdev
      FIXTURES: apps/judge/tests/CodeJudge.Judge.Tests/Fixtures

    steps:
      - uses: actions/checkout@v5

      # The runner's default builder uses the plain `docker` driver, which cannot export
      # a cache: `cache-to: type=gha` fails outright with "Cache export is not supported
      # for the docker driver". This sets up a docker-container driver builder, which can.
      # `load: true` below still works on that driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Proves the image builds on every PR. Pushing to GHCR happens in cd-deploy,
      # only after a merge to main.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/CodeJudge.Api/Dockerfile
          push: false
          tags: codejudge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # load: true hands the image to the local daemon, which the smoke tests below need
      # in order to actually run it.
      - name: Build judge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/judge/CodeJudge.Judge/Dockerfile
          push: false
          load: true
          tags: codejudge-judge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Seeding with the judge image rather than the SDK is deliberate: it exercises the
      # published binary's database path before anything depends on it.
      - name: Seed the database using the judge image
        run: |
          docker run --rm --network host \
            -e CODEJUDGE_CONNECTION="$CODEJUDGE_CONNECTION" \
            codejudge-judge:ci seed

      # `dotnet build` cannot catch this. Runner.targets copies the sandbox runner into
      # $(OutDir), which `dotnet publish` never consumes, so the image can build perfectly
      # and still throw FileNotFoundException on its first real submission. Judging
      # something is the only check that proves the runner actually shipped.
      - name: Smoke test, a correct submission is Accepted
        run: |
          output=$(docker run --rm --network host \
            -e CODEJUDGE_CONNECTION="$CODEJUDGE_CONNECTION" \
            -v "$PWD/$FIXTURES:/fixtures:ro" \
            codejudge-judge:ci judge --problem two-sum --file /fixtures/correct.cs 2>&1)
          echo "$output"
          grep -qE "Verdict:[[:space:]]+Accepted" <<< "$output" || {
            echo "::error::Expected Accepted from the containerised judge."
            exit 1
          }

      # The guarantee the entire child-process design exists to provide: a parent that
      # can still kill a runaway child when both are inside a container.
      - name: Smoke test, an infinite loop is TimeLimitExceeded
        run: |
          output=$(docker run --rm --network host \
            -e CODEJUDGE_CONNECTION="$CODEJUDGE_CONNECTION" \
            -v "$PWD/$FIXTURES:/fixtures:ro" \
            codejudge-judge:ci judge --problem two-sum --file /fixtures/infinite-loop.cs 2>&1)
          echo "$output"
          grep -qE "Verdict:[[:space:]]+TimeLimitExceeded" <<< "$output" || {
            echo "::error::Expected TimeLimitExceeded from the containerised judge."
            exit 1
          }
